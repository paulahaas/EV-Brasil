<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EV Brasil</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0e17">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <a href="index.html" class="brand login-brand">
      <span class="logo-mark">⚡</span>
      <span>EV<span class="accent">Brasil</span></span>
    </a>

    <h1>Entrar</h1>

    <p>Entre na sua conta.</p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
        required
      >

      <p class="form-error" id="authError" role="alert"></p>

      <button type="submit">
        Entrar
      </button>

    </form>

    <p class="login-alt">
      Não possui conta?
      <a href="cadastro.html" data-manter-next>Criar conta</a>
    </p>

  </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
