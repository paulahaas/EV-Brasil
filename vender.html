<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vender meu EV | EV Brasil</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Anuncie seu veículo elétrico na EV Brasil e fale direto com compradores.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0e17">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="header-slot"></div>

  <!-- Fica escondido até js/sell.js confirmar o login. -->
  <main id="protegido" hidden>
    <section>
      <div class="container">

        <div class="section-head">
          <span class="eyebrow">Desapegue do combustível</span>

          <h1 class="section-title" id="sellTitle">
            Anunciar seu veículo
          </h1>

          <p class="section-sub" id="sellSub">
            Preencha os dados abaixo e seu EV será publicado na vitrine para compradores entrarem em contato.
          </p>
        </div>

        <form id="sellForm" class="sell-form">

          <div class="form-grid">

            <div class="form-group">
              <label for="marca">Marca</label>
              <input
                type="text"
                id="marca"
                name="marca"
                placeholder="Ex.: BYD, Geely, Chevrolet"
                required>
            </div>

            <div class="form-group">
              <label for="modelo">Modelo</label>
              <input
                type="text"
                id="modelo"
                name="modelo"
                placeholder="Ex.: Dolphin, EX2, Spark EUV"
                required>
            </div>

            <div class="form-group">
              <label for="ano">Ano</label>
              <input
                type="number"
                id="ano"
                name="ano"
                min="1990"
                max="2027"
                placeholder="Ex.: 2024"
                required>
            </div>

            <div class="form-group">
              <label for="quilometragem">
                Quilometragem rodada
              </label>

              <input
                type="number"
                id="quilometragem"
                name="quilometragem"
                min="0"
                placeholder="Ex.: 15000"
                required>
            </div>

            <div class="form-group">
              <label for="tipo_carroceria">
                Tipo de carroceria
              </label>

              <select
                id="tipo_carroceria"
                name="tipo_carroceria"
                required>

                <option value="">
                  Selecione...
                </option>

                <option value="Sedan">Sedan</option>
                <option value="SUV">SUV</option>
                <option value="Hatch">Hatch</option>
                <option value="Picape">Picape</option>
                <option value="Minivan">Minivan</option>
                <option value="Cupê">Cupê</option>
                <option value="Conversível">Conversível</option>

              </select>
            </div>

            <div class="form-group">
              <label for="estado_conservacao">
                Estado de conservação
              </label>

              <select
                id="estado_conservacao"
                name="estado_conservacao"
                required>

                <option value="">
                  Selecione...
                </option>

                <option value="Novo">Novo</option>
                <option value="Seminovo">Seminovo</option>
                <option value="Usado">Usado</option>

              </select>
            </div>

            <div class="form-group form-group-full">

              <label for="preco">
                Preço desejado (R$)
              </label>

              <div class="input-prefix">
                <span class="prefix">R$</span>

                <input
                  type="text"
                  id="preco"
                  name="preco"
                  inputmode="numeric"
                  placeholder="150.000"
                  required>

              </div>

            </div>

            <div class="form-group">
              <label for="cidade">Cidade</label>

              <input
                type="text"
                id="cidade"
                name="cidade"
                placeholder="Ex.: São Paulo"
                required>
            </div>

            <div class="form-group">

              <label for="estado">Estado</label>

              <select
                id="estado"
                name="estado"
                required>

                <option value="">
                  Selecione...
                </option>

                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>

              </select>

            </div>

            <div class="form-group form-group-full">

              <label for="fotos">Fotos do veículo</label>

              <input
                type="file"
                id="fotos"
                accept="image/*"
                multiple>

              <span class="form-hint" id="fotosHint"></span>

              <!-- Miniaturas das fotos escolhidas (js/sell.js) -->
              <div class="fotos-preview" id="fotosPreview"></div>

            </div>

            <div class="form-group form-group-full">

              <label for="descricao">
                Descrição do veículo
              </label>

              <textarea
                id="descricao"
                name="descricao"
                rows="4"
                placeholder="Detalhe autonomia, cor, opcionais, condição das baterias, histórico de revisões..."></textarea>

            </div>

            <div class="form-group form-group-full">

              <label for="whatsapp">
                WhatsApp para contato
              </label>

              <input
                type="tel"
                id="whatsapp"
                name="whatsapp"
                placeholder="Ex.: 11999999999"
                required>

              <span class="form-hint">
                Apenas números. O comprador falará diretamente com você.
              </span>

            </div>

          </div>

          <div class="form-actions">

            <button
              type="submit"
              class="btn btn-primary btn-lg">

              Publicar anúncio

            </button>

            <a
              href="veiculos.html"
              class="btn btn-ghost btn-lg">

              Ver veículos

            </a>

          </div>

          <p class="form-error" id="sellError" role="alert"></p>

        </form>

      </div>
    </section>
  </main>

  <div id="footer-slot"></div>

  <script src="js/main.js"></script>
  <script>
    mountChrome("vender");
  </script>
  <script type="module" src="js/sell.js"></script>

</body>
</html>
