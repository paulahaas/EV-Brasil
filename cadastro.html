<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | EV Brasil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <a href="index.html" class="brand login-brand">
      <span class="logo-mark">⚡</span>
      <span>EV<span class="accent">Brasil</span></span>
    </a>

    <h1>Criar Conta</h1>

    <p>Cadastre-se para anunciar veículos.</p>

    <form id="cadastroForm">

      <input
        type="text"
        id="nome"
        placeholder="Nome completo"
        autocomplete="name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="E-mail"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="senha"
        placeholder="Senha (mínimo 6 caracteres)"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <p class="form-error" id="authError" role="alert"></p>

      <button type="submit">
        Criar conta
      </button>

    </form>

    <p class="login-alt">
      Já possui conta?
      <a href="login.html" data-manter-next>Entrar</a>
    </p>

  </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
