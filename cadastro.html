<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | EV Brasil</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Criar Conta</h1>

        <p>Cadastre-se para anunciar veículos.</p>

        <form id="cadastroForm">

            <input
                type="text"
                id="nome"
                placeholder="Nome completo"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <p>

            Já possui conta?

            <a href="login.html">
                Entrar
            </a>

        </p>

    </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
