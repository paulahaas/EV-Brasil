<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veículos — EV Brasil</title>
  <meta name="description" content="Catálogo completo de veículos elétricos à venda no Brasil. Filtre por marca, tipo e faixa de preço." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="header-slot"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow">Catálogo</span>
        <h1 class="section-title">Veículos elétricos</h1>
        <p class="results-count" id="resultsCount"></p>
      </div>
    </section>

    <!-- Filtros: ficam presos no topo ao rolar -->
    <div class="filterbar">
      <div class="container filters">
        <div class="filter-group" id="brandFilters"></div>
        <div class="filter-group" id="typeFilters"></div>
        <div class="spacer"></div>
        <select class="select" id="sortSelect" aria-label="Ordenar">
          <option value="destaque">Ordenar: Destaques</option>
          <option value="menor">Preço: menor primeiro</option>
          <option value="maior">Preço: maior primeiro</option>
          <option value="autonomia">Maior autonomia</option>
        </select>
      </div>
    </div>

    <section class="section-flush">
      <div class="container">
        <div class="grid" id="vehiclesGrid"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
          Nenhum veículo encontrado com esses filtros. Tente ajustar sua busca.
        </div>

        <!-- Anúncios publicados pelos usuários (js/anuncios.js) -->
        <div id="userVehicles"></div>
      </div>
    </section>
  </main>

  <div id="footer-slot"></div>

  <script src="js/data.js"></script>
  <script src="js/car-svg.js"></script>
  <script src="js/main.js"></script>
  <script src="js/veiculos.js"></script>
  <script type="module" src="js/anuncios.js"></script>
  <script type="module" src="js/session.js"></script>
</body>
</html>
