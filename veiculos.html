<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veículos — EV Brasil</title>
  <meta name="description" content="Catálogo completo de veículos elétricos à venda no Brasil. Filtre por marca, tipo e faixa de preço." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0e17">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="header-slot"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow">Catálogo</span>
        <h1 class="section-title">Veículos elétricos</h1>
        <p class="results-count">
          <span id="resultsCount"></span> ·
          <a href="comparar.html" class="text-link">Comparar modelos</a>
        </p>
      </div>
    </section>

    <!-- Filtros: ficam presos no topo ao rolar -->
    <div class="filterbar">
      <div class="container filters">
        <input class="search" type="search" id="searchInput" placeholder="Buscar marca ou modelo" aria-label="Buscar marca ou modelo">
        <div class="filter-group" id="typeFilters"></div>
        <div class="spacer"></div>
        <select class="select" id="brandSelect" aria-label="Marca"></select>
        <select class="select" id="priceSelect" aria-label="Preço máximo">
          <option value="0">Preço: qualquer</option>
          <option value="150000">Até R$ 150 mil</option>
          <option value="250000">Até R$ 250 mil</option>
          <option value="400000">Até R$ 400 mil</option>
        </select>
        <select class="select" id="rangeSelect" aria-label="Autonomia mínima">
          <option value="0">Autonomia: qualquer</option>
          <option value="300">300 km ou mais</option>
          <option value="400">400 km ou mais</option>
          <option value="500">500 km ou mais</option>
        </select>
        <select class="select" id="sortSelect" aria-label="Ordenar">
          <option value="destaque">Ordenar: Destaques</option>
          <option value="menor">Preço: menor primeiro</option>
          <option value="maior">Preço: maior primeiro</option>
          <option value="autonomia">Maior autonomia</option>
        </select>
        <button type="button" class="chip" id="clearFilters" hidden>Limpar filtros</button>
      </div>
    </div>

    <section class="section-flush">
      <div class="container">
        <div class="grid" id="vehiclesGrid"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
          Nenhum veículo encontrado com esses filtros. Tente ajustar sua busca.
        </div>

        <!-- Anúncios publicados pelos usuários (js/anuncios.js) -->
        <div id="userVehicles"></div>
      </div>
    </section>
  </main>

  <div id="footer-slot"></div>

  <script src="js/data.js"></script>
  <script src="js/car-svg.js"></script>
  <script src="js/main.js"></script>
  <script src="js/veiculos.js"></script>
  <script type="module" src="js/anuncios.js"></script>
  <script type="module" src="js/session.js"></script>
</body>
</html>
